name: Backfill PeeringDB Snapshot 2026-06-30

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-2026-06-30.yml"

concurrency:
  group: peeringdb-backfill-2026-06-30
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      SNAPSHOT_TIMEZONE: Asia/Singapore
      SNAPSHOT_BLOB_PREFIX: snapshots
      SNAPSHOT_BLOB_ACCESS: public
      SNAPSHOT_PAGE_LIMIT: "5000"
      SNAPSHOT_MAX_PAGES: "5000"
      SNAPSHOT_PAGE_DELAY_MS: "1000"
      PEERINGDB_MAX_RETRIES: "600"
      PEERINGDB_MAX_RETRY_TIME_MS: "3600000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run June 2026 backfill
        run: npm run snapshot:run -- --force --snapshot-date=2026-06-30
